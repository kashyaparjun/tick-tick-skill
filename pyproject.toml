[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ticktick-cli"
version = "0.1.0"
description = "CLI tool for TickTick task management"
requires-python = ">=3.9"
dependencies = [
    "click>=8.0",
    "requests>=2.28.0",
]

[project.scripts]
tt = "ticktick_cli.cli:cli"

[tool.setuptools.packages.find]
include = ["ticktick_cli*"]
